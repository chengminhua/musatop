name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check release tag and package identity
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          from musatop import __version__
          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          assert project['name'] == 'musatop'
          if os.environ['REF_TYPE'] == 'tag':
              assert os.environ['REF_NAME'] == f'v{__version__}', 'Tag and package version differ'
          print(f'Building musatop {__version__}')
          PY
      - run: python -m pip install --upgrade build twine
      - name: Build wheel from source distribution and check metadata
        run: |
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist
      - name: Test installed wheel outside the source checkout
        run: |
          python -m pip install dist/*.whl
          python -m pip check
          check_dir=$(mktemp -d)
          mkdir "$RUNNER_TEMP/source-distribution"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/source-distribution"
          cp -R "$RUNNER_TEMP/source-distribution/"*/tests "$RUNNER_TEMP/source-distribution/"*/tools "$check_dir/"
          cd "$check_dir"
          python -m unittest discover -s tests -v
          musatop --version
          python -m musatop --help
          python - <<'PY'
          import importlib.metadata
          from pathlib import Path
          import musatop
          assert importlib.metadata.version('musatop') == musatop.__version__
          assert not Path(musatop.__file__).resolve().is_relative_to(Path.cwd())
          print('Verified installed package:', musatop.__file__)
          PY
      - name: Check source distribution installation
        run: |
          python -m venv "$RUNNER_TEMP/sdist-env"
          "$RUNNER_TEMP/sdist-env/bin/python" -m pip install dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sdist-env/bin/python" -m pip check
          "$RUNNER_TEMP/sdist-env/bin/musatop" --version
          "$RUNNER_TEMP/sdist-env/bin/python" -m musatop --help

  publish:
    needs: [build, test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'chengminhua/musatop'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/musatop/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist
      - name: Publish verified distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist
      - name: Create GitHub release with the published distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          Install or upgrade from PyPI:

          ```bash
          python -m pip install -U musatop
          musatop --version
          musatop
          ```

          Requires Linux, Python >=3.10 and a working `mthreads-gmi` installation.
          See the README and docs/VALIDATION.md at this tag for features and hardware coverage.
          The attached wheel and source archive are the same distributions uploaded to PyPI.
          EOF
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "musatop $RELEASE_TAG" --notes-file release-notes.md
